<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简历DIY - 制作你的个人简历</title>
<style>
/* ===== Editor Reset & Variables ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ed-bg:#f0f0f3;
  --ed-surface:#fff;
  --ed-text:#1d1d1f;
  --ed-text2:#86868b;
  --ed-border:#e5e5ea;
  --ed-accent:#5b5fef;
  --ed-accent-hover:#4845d6;
  --ed-accent-light:#eef0ff;
  --ed-danger:#e55;
  --ed-radius:10px;
  --ed-radius-sm:6px;
  --ed-font:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
}
body{font-family:var(--ed-font);background:var(--ed-bg);color:var(--ed-text);height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* ===== Top Bar ===== */
.topbar{
  height:56px;min-height:56px;background:var(--ed-surface);
  border-bottom:1px solid var(--ed-border);display:flex;
  align-items:center;padding:0 16px;gap:12px;z-index:100;
  box-shadow:0 1px 4px rgba(0,0,0,.04);position:relative;
}
.topbar-left{display:flex;align-items:center;gap:10px;flex-shrink:0}
.back-link{
  text-decoration:none;color:var(--ed-text2);font-size:.84rem;
  font-weight:500;transition:color .2s;white-space:nowrap;
  display:flex;align-items:center;gap:4px;
}
.back-link:hover{color:var(--ed-accent)}
.topbar-divider{color:var(--ed-border);font-size:.9rem}
.topbar-title{font-weight:700;font-size:.95rem;white-space:nowrap}
.topbar-center{
  flex:1;display:flex;justify-content:center;gap:6px;
  overflow-x:auto;padding:0 8px;
}
.template-btn{
  padding:6px 14px;border-radius:20px;border:1.5px solid var(--ed-border);
  background:var(--ed-surface);font-size:.8rem;cursor:pointer;
  transition:all .2s;white-space:nowrap;font-family:var(--ed-font);
  color:var(--ed-text2);font-weight:500;
}
.template-btn:hover{border-color:var(--ed-accent);color:var(--ed-accent)}
.template-btn.active{background:var(--ed-accent);color:#fff;border-color:var(--ed-accent);font-weight:600}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.filename-input{
  width:130px;padding:6px 10px;border-radius:var(--ed-radius-sm);
  border:1.5px solid var(--ed-border);font-size:.82rem;
  font-family:var(--ed-font);color:var(--ed-text);text-align:center;
  transition:border-color .2s;
}
.filename-input:focus{outline:none;border-color:var(--ed-accent)}
.export-btn{
  padding:7px 14px;border-radius:20px;border:none;
  font-size:.8rem;cursor:pointer;font-weight:600;
  font-family:var(--ed-font);transition:all .2s;
  background:var(--ed-accent-light);color:var(--ed-accent);white-space:nowrap;
}
.export-btn:hover{background:var(--ed-accent);color:#fff}
.export-btn.primary{background:var(--ed-accent);color:#fff}
.export-btn.primary:hover{background:var(--ed-accent-hover)}

/* ===== Main Layout ===== */
.main-wrap{flex:1;display:flex;overflow:hidden}

/* ===== Left Panel ===== */
.editor-panel{
  width:380px;min-width:380px;background:var(--ed-surface);
  border-right:1px solid var(--ed-border);overflow-y:auto;
  padding:8px;scroll-behavior:smooth;
}
.editor-panel::-webkit-scrollbar{width:5px}
.editor-panel::-webkit-scrollbar-thumb{background:var(--ed-border);border-radius:10px}

.accordion{margin-bottom:4px;border-radius:var(--ed-radius);overflow:hidden}
.accordion-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;cursor:pointer;font-weight:600;font-size:.88rem;
  background:var(--ed-bg);border-radius:var(--ed-radius);
  transition:all .2s;user-select:none;gap:8px;
}
.accordion-header:hover{background:#e8e8ed}
.accordion-header .arrow{transition:transform .25s;font-size:.7rem;color:var(--ed-text2)}
.accordion.open .accordion-header .arrow{transform:rotate(180deg)}
.accordion.open .accordion-header{background:var(--ed-accent-light);color:var(--ed-accent)}
.accordion-body{display:none;padding:12px 14px}
.accordion.open .accordion-body{display:block}

.form-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.form-row input,.form-row textarea{
  flex:1;min-width:80px;padding:8px 10px;border-radius:var(--ed-radius-sm);
  border:1.5px solid var(--ed-border);font-family:var(--ed-font);
  font-size:.84rem;color:var(--ed-text);transition:border-color .2s;
  background:var(--ed-bg);
}
.form-row input:focus,.form-row textarea:focus{outline:none;border-color:var(--ed-accent);background:var(--ed-surface)}
.form-row textarea{min-height:60px;resize:vertical;width:100%}
.form-label{font-size:.78rem;color:var(--ed-text2);font-weight:600;margin-bottom:3px;display:block}

.dynamic-list{margin-top:6px}
.dynamic-item{
  background:var(--ed-bg);border-radius:var(--ed-radius-sm);
  padding:10px 12px;margin-bottom:8px;position:relative;
  border:1px solid transparent;transition:border-color .2s;
}
.dynamic-item:hover{border-color:var(--ed-border)}
.dynamic-item .remove-btn{
  position:absolute;top:8px;right:8px;
  width:24px;height:24px;border-radius:50%;
  border:none;background:transparent;color:var(--ed-text2);
  cursor:pointer;font-size:1rem;transition:all .2s;
  display:flex;align-items:center;justify-content:center;
}
.dynamic-item .remove-btn:hover{background:#fee2e2;color:var(--ed-danger)}
.add-btn{
  width:100%;padding:8px;border-radius:var(--ed-radius-sm);
  border:2px dashed var(--ed-border);background:transparent;
  color:var(--ed-text2);font-size:.82rem;cursor:pointer;
  font-family:var(--ed-font);font-weight:500;transition:all .2s;
}
.add-btn:hover{border-color:var(--ed-accent);color:var(--ed-accent);background:var(--ed-accent-light)}

.avatar-upload-area{
  display:flex;align-items:center;gap:12px;margin-bottom:10px;
}
.avatar-preview{
  width:64px;height:64px;border-radius:50%;background:var(--ed-bg);
  border:2px dashed var(--ed-border);display:flex;align-items:center;
  justify-content:center;overflow:hidden;flex-shrink:0;
  font-size:1.5rem;color:var(--ed-text2);cursor:pointer;transition:all .2s;
}
.avatar-preview:hover{border-color:var(--ed-accent)}
.avatar-preview img{width:100%;height:100%;object-fit:cover}
.avatar-hint{font-size:.78rem;color:var(--ed-text2)}

/* ===== Right Panel ===== */
.preview-panel{
  flex:1;display:flex;align-items:flex-start;justify-content:center;
  padding:20px;overflow:auto;background:var(--ed-bg);
}
.preview-panel iframe{
  width:100%;max-width:900px;min-height:100%;border:none;
  border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.12);
  background:#fff;
}

/* ===== Toast ===== */
.toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(100px);
  background:#1d1d1f;color:#fff;padding:10px 22px;border-radius:22px;
  font-size:.84rem;z-index:999;transition:transform .35s cubic-bezier(.4,0,.2,1);
  pointer-events:none;font-weight:500;
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ===== Responsive ===== */
@media(max-width:900px){
  .main-wrap{flex-direction:column}
  .editor-panel{width:100%;min-width:100%;max-height:45%;border-right:none;border-bottom:1px solid var(--ed-border)}
  .preview-panel{min-height:55%;padding:12px}
  .template-btn{font-size:.74rem;padding:5px 10px}
  .topbar{flex-wrap:wrap;height:auto;padding:8px 12px;gap:8px}
  .topbar-center{order:3;width:100%;justify-content:flex-start}
}
</style>
</head>
<body>

<!-- ===== Top Bar ===== -->
<header class="topbar">
  <div class="topbar-left">
    <a href="index.html" class="back-link">← 返回周文璐主页</a>
    <span class="topbar-divider">|</span>
    <span class="topbar-title">📝 简历DIY制作器</span>
  </div>
  <div class="topbar-center" id="templateTabs"></div>
  <div class="topbar-right">
    <input class="filename-input" id="fileNameInput" placeholder="文件名" onchange="onFileNameChange()">
    <button class="export-btn primary" onclick="exportHTML()">📥 HTML</button>
    <button class="export-btn" onclick="exportPDF()">📄 PDF</button>
  </div>
</header>

<!-- ===== Main ===== -->
<div class="main-wrap">
  <!-- Left Panel -->
  <aside class="editor-panel" id="editorPanel">
    <div class="accordion open" id="acc-basics">
      <div class="accordion-header" onclick="toggleAccordion('acc-basics')">📋 基本信息 <span class="arrow">▾</span></div>
      <div class="accordion-body" id="formBasics"></div>
    </div>
    <div class="accordion" id="acc-advantages">
      <div class="accordion-header" onclick="toggleAccordion('acc-advantages')">💪 核心优势 <span class="arrow">▾</span></div>
      <div class="accordion-body" id="formAdvantages"></div>
    </div>
    <div class="accordion open" id="acc-experiences">
      <div class="accordion-header" onclick="toggleAccordion('acc-experiences')">💼 工作经历 <span class="arrow">▾</span></div>
      <div class="accordion-body" id="formExperiences"></div>
    </div>
    <div class="accordion" id="acc-projects">
      <div class="accordion-header" onclick="toggleAccordion('acc-projects')">🚀 项目经验 <span class="arrow">▾</span></div>
      <div class="accordion-body" id="formProjects"></div>
    </div>
    <div class="accordion" id="acc-portfolio">
      <div class="accordion-header" onclick="toggleAccordion('acc-portfolio')">🖼️ 作品集 <span class="arrow">▾</span></div>
      <div class="accordion-body" id="formPortfolio"></div>
    </div>
    <div class="accordion" id="acc-education">
      <div class="accordion-header" onclick="toggleAccordion('acc-education')">🎓 教育背景 <span class="arrow">▾</span></div>
      <div class="accordion-body" id="formEducation"></div>
    </div>
    <div class="accordion" id="acc-skills">
      <div class="accordion-header" onclick="toggleAccordion('acc-skills')">🛠️ 专业技能 <span class="arrow">▾</span></div>
      <div class="accordion-body" id="formSkills"></div>
    </div>
    <div style="padding:12px 14px;display:flex;gap:8px">
      <button class="add-btn" onclick="clearAll()" style="color:var(--ed-danger);border-color:var(--ed-danger)">🗑️ 清空所有内容</button>
    </div>
  </aside>

  <!-- Right Panel -->
  <main class="preview-panel">
    <iframe id="previewFrame" title="简历预览"></iframe>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================================================================
   DATA MODEL
   ================================================================ */
const EMPTY_DATA = {
  basics: { name:'', title:'', location:'', salary:'', status:'随时到岗', phone:'', email:'', school:'', major:'', degree:'本科', schoolPeriod:'', birth:'' },
  avatar: '',
  advantages: [],
  experiences: [],
  projects: [],
  education: { school:'', major:'', degree:'本科', period:'' },
  skills: [],
  portfolio: [],
  templateId: 'classic-white',
  fileName: '我的简历'
};

// Load from localStorage or use empty
let resumeData = loadData();

function loadData(){
  try{
    const d = localStorage.getItem('diy_resume_data');
    if(d){ const parsed = JSON.parse(d); if(parsed && parsed.basics) return parsed; }
  }catch(e){}
  return JSON.parse(JSON.stringify(EMPTY_DATA));
}

function saveData(){
  localStorage.setItem('diy_resume_data', JSON.stringify(resumeData));
  renderPreview();
}

let saveTimeout;
function autoSave(){
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveData, 300);
}

function debouncePreview(){
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveData, 300);
}

/* ================================================================
   TEMPLATES
   ================================================================ */
const TEMPLATES = [
  {
    id: 'classic-white', name: '经典简约白', icon: '⬜',
    render(data){ return renderClassicWhite(data); }
  },
  {
    id: 'dark-tech', name: '深色科技风', icon: '🌙',
    render(data){ return renderDarkTech(data); }
  },
  {
    id: 'elegant-sidebar', name: '优雅侧边栏', icon: '📑',
    render(data){ return renderElegantSidebar(data); }
  },
  {
    id: 'timeline-narrative', name: '时间轴叙事', icon: '⏳',
    render(data){ return renderTimelineNarrative(data); }
  },
  {
    id: 'fresh-natural', name: '清新自然', icon: '🌿',
    render(data){ return renderFreshNatural(data); }
  }
];

function getCurrentTemplate(){
  return TEMPLATES.find(t=>t.id===resumeData.templateId) || TEMPLATES[0];
}

/* ================================================================
   TEMPLATE 1: 经典简约白
   ================================================================ */
function renderClassicWhite(d){
  return `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>${esc(d.basics.name||'未命名')} · 个人简历</title><style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f8f9fb;--surface:#fff;--surface-alt:#f1f3f7;--text:#1e1e2e;--text2:#5a5d6e;--text3:#8b8fa3;--accent:#5b5fef;--accent-light:#eef0ff;--gold:#c8a05a;--gold-light:#fdf6ed;--border:#e8eaf0;--shadow:0 4px 16px rgba(0,0,0,.06);--radius:12px;--font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased}
.hero{padding:80px 24px 64px;background:linear-gradient(160deg,#1a1a30 0%,#1e2040 30%,#1a1a35 60%,#222240 100%);color:#fff;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;right:-20%;width:500px;height:500px;background:radial-gradient(circle,rgba(91,95,239,.25),transparent 70%);border-radius:50%}
.hero-inner{max-width:900px;margin:0 auto;position:relative;z-index:1;display:flex;align-items:center;gap:40px;flex-wrap:wrap}
.hero-avatar{width:140px;height:140px;border-radius:50%;flex-shrink:0;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero-avatar img{width:100%;height:100%;object-fit:cover}
.hero-avatar span{font-size:3rem;color:rgba(255,255,255,.2)}
.hero-name{font-size:2.4rem;font-weight:800}
.hero-meta{color:rgba(255,255,255,.7);font-size:.95rem;margin:6px 0 12px;display:flex;flex-wrap:wrap;gap:4px 12px}
.hero-contact{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.84rem;color:rgba(255,255,255,.5);margin-top:8px}
.section{padding:56px 24px}
.section-inner{max-width:900px;margin:0 auto}
.section-label{font-size:.78rem;font-weight:700;letter-spacing:2px;color:var(--accent);margin-bottom:6px;text-transform:uppercase}
.section-title{font-size:1.6rem;font-weight:800;margin-bottom:28px}
.section-alt{background:var(--surface-alt)}
.adv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.adv-card{background:var(--surface);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1px solid var(--border)}
.adv-icon{font-size:1.4rem;margin-bottom:10px}
.adv-card h3{font-size:.95rem;margin-bottom:4px}
.adv-card p{font-size:.82rem;color:var(--text2);line-height:1.55}
.timeline{position:relative}
.timeline::before{content:'';position:absolute;left:17px;top:8px;bottom:8px;width:2px;background:var(--border)}
.tl-item{position:relative;padding-left:44px;margin-bottom:28px}
.tl-dot{position:absolute;left:9px;top:4px;width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--accent-light);z-index:1}
.tl-card{background:var(--surface);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1px solid var(--border)}
.tl-header{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.tl-company{font-weight:700;font-size:1rem}
.tl-date{font-size:.78rem;color:var(--text3);background:var(--surface-alt);padding:3px 10px;border-radius:12px}
.tl-role{font-size:.85rem;color:var(--accent);font-weight:600;margin-bottom:6px}
.tl-details{list-style:none}
.tl-details li{font-size:.82rem;color:var(--text2);padding:2px 0 2px 16px;position:relative}
.tl-details li::before{content:'';position:absolute;left:0;top:10px;width:4px;height:4px;border-radius:50%;background:var(--border)}
.tl-reason{margin-top:10px;padding:10px 14px;background:var(--gold-light);border-radius:8px;border-left:3px solid var(--gold);font-size:.8rem;color:#8b6914}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.proj-card{background:var(--surface);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);border:1px solid var(--border)}
.proj-card h3{font-size:.95rem;margin-bottom:6px}
.proj-card p{font-size:.82rem;color:var(--text2)}
.proj-tag{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:12px;font-size:.74rem;font-weight:600;background:var(--accent-light);color:var(--accent)}
.edu-card{background:var(--surface);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1px solid var(--border);display:flex;gap:16px;align-items:center}
.edu-icon{width:48px;height:48px;border-radius:10px;background:var(--gold-light);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.skill-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.skill-group h3{font-size:.88rem;margin-bottom:10px}
.skill-tags{display:flex;flex-wrap:wrap;gap:7px}
.skill-tag{padding:5px 12px;border-radius:16px;font-size:.8rem;background:var(--surface);border:1px solid var(--border);color:var(--text2)}
.footer{text-align:center;padding:32px;color:var(--text3);font-size:.78rem;border-top:1px solid var(--border)}
@media(max-width:640px){.hero-inner{flex-direction:column;text-align:center}.hero-avatar{width:100px;height:100px}.hero-name{font-size:1.8rem}.hero-meta,.hero-contact{justify-content:center}.tl-header{flex-direction:column}.adv-grid{grid-template-columns:1fr}}
@media print{body{background:#fff}.hero{background:#fff!important;color:#000!important;padding:20px 0}.hero-name,.hero-meta,.hero-contact{color:#000!important}.section{padding:16px 0;page-break-inside:avoid}.tl-card,.adv-card,.proj-card{box-shadow:none;border:1px solid #ddd}}
</style></head><body>
${buildHero(d)}
<section class="section"><div class="section-inner">
  <div class="section-label">核心优势</div><h2 class="section-title">为什么选择我</h2>
  <div class="adv-grid">${(d.advantages||[]).map(a=>`<div class="adv-card"><div class="adv-icon">${esc(a.icon||'✨')}</div><h3>${esc(a.title)}</h3><p>${esc(a.desc)}</p></div>`).join('')}</div>
</div></section>
<section class="section section-alt"><div class="section-inner">
  <div class="section-label">工作经历</div><h2 class="section-title">职业历程</h2>
  <div class="timeline">${(d.experiences||[]).map(e=>`<div class="tl-item"><div class="tl-dot"></div><div class="tl-card"><div class="tl-header"><span class="tl-company">${esc(e.company)}</span><span class="tl-date">${esc(e.date)}</span></div><div class="tl-role">${esc(e.role)}</div><ul class="tl-details">${(e.details||[]).map(dd=>`<li>${esc(dd)}</li>`).join('')}</ul>${e.reason?`<div class="tl-reason">${esc(e.reason)}</div>`:''}</div></div>`).join('')}</div>
</div></section>
<section class="section"><div class="section-inner">
  <div class="section-label">项目经验</div><h2 class="section-title">项目</h2>
  <div class="proj-grid">${(d.projects||[]).map(p=>`<div class="proj-card"><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><span class="proj-tag">${esc(p.tag)}</span></div>`).join('')}</div>

function handleAvatarUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      const maxW = 300;
      const scale = Math.min(1, maxW/img.width);
      canvas.width = img.width*scale;
      canvas.height = img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      resumeData.avatar = canvas.toDataURL('image/jpeg',0.8);
      saveData();
      buildBasicsForm();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

/* ============ Batch Portfolio Upload for DIY ============ */
let _diyPendingFiles = [];
function openBatchPortfolio(){
  // Create a one-time file input for batch upload
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*,video/*';
  input.multiple = true;
  input.style.display = 'none';
  input.onchange = async function(e){
    const files = Array.from(e.target.files || []);
    if(!files.length) return;
    if(!resumeData.portfolio) resumeData.portfolio = [];

    for(const file of files){
      const isVideo = file.type.startsWith('video/');
      const base64 = await fileToBase64DIY(file);
      let poster = '';
      if(isVideo){
        try{ poster = await generateVideoThumbnailDIY(base64); }catch(e){}
      }
      resumeData.portfolio.push({
        name: file.name.replace(/\.[^.]+$/, ''),
        src: isVideo ? base64 : await compressImageDIY(base64, 600),
        type: isVideo ? 'video' : 'image',
        poster: poster
      });
    }
    saveData();
    buildPortfolioForm();
    toast('✅ 已添加 ' + files.length + ' 个作品');
  };
  document.body.appendChild(input);
  input.click();
  setTimeout(() => document.body.removeChild(input), 5000);
}

// Also support folder upload
function openFolderPortfolio(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*,video/*';
  input.webkitdirectory = true;
  input.style.display = 'none';
  input.onchange = async function(e){
    const files = Array.from(e.target.files || []);
    if(!files.length) return;
    if(!resumeData.portfolio) resumeData.portfolio = [];
    // Limit to 50 files
    const limited = files.slice(0, 50);
    for(const file of limited){
      const isVideo = file.type.startsWith('video/');
      const base64 = await fileToBase64DIY(file);
      let poster = '';
      if(isVideo){
        try{ poster = await generateVideoThumbnailDIY(base64); }catch(e){}
      }
      resumeData.portfolio.push({
        name: file.name.replace(/\.[^.]+$/, ''),
        src: isVideo ? base64 : await compressImageDIY(base64, 600),
        type: isVideo ? 'video' : 'image',
        poster: poster
      });
    }
    saveData();
    buildPortfolioForm();
    toast('✅ 已添加 ' + limited.length + ' 个作品' + (files.length > 50 ? '（截取前50个）' : ''));
  };
  document.body.appendChild(input);
  input.click();
  setTimeout(() => document.body.removeChild(input), 5000);
}

function fileToBase64DIY(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function compressImageDIY(dataUrl, maxW){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      const scale = Math.min(1, maxW / img.width);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

function generateVideoThumbnailDIY(dataUrl){
  return new Promise((resolve) => {
    const video = document.createElement('video');
    video.preload = 'metadata';
    video.muted = true;
    video.playsInline = true;
    video.currentTime = 1;
    video.onloadeddata = function(){ video.currentTime = 1; };
    video.onseeked = function(){
      try{
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 320;
        canvas.height = video.videoHeight || 180;
        const scale = Math.min(1, 200 / canvas.width);
        canvas.width *= scale;
        canvas.height *= scale;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      }catch(e){ resolve(''); }
    };
    video.onerror = () => resolve('');
    video.src = dataUrl;
    setTimeout(() => resolve(''), 3000);
  });
}

function addPortfolio(){
  if(!resumeData.portfolio) resumeData.portfolio = [];
  resumeData.portfolio.push({name:'',src:'',type:'image',poster:''});
  saveData();
  buildPortfolioForm();
}
function removePortfolio(i){
  resumeData.portfolio.splice(i,1);
  saveData();
  buildPortfolioForm();
}
function updatePortfolio(i,field,value){
  resumeData.portfolio[i][field] = value;
  debouncePreview();
}
function handlePortUpload(e,i){
  const file = e.target.files[0];
  if(!file) return;
  const isVideo = file.type.startsWith('video/');
  const reader = new FileReader();
  reader.onload = async function(ev){
    if(isVideo){
      // Video - store as base64, generate thumbnail
      let poster = '';
      try{ poster = await generateVideoThumbnailDIY(ev.target.result); }catch(e){}
      resumeData.portfolio[i].src = ev.target.result;
      resumeData.portfolio[i].type = 'video';
      resumeData.portfolio[i].poster = poster;
      if(!resumeData.portfolio[i].name) resumeData.portfolio[i].name = file.name.replace(/\.[^.]+$/, '');
      saveData();
      buildPortfolioForm();
    }else{
      const img = new Image();
      img.onload = function(){
        const canvas = document.createElement('canvas');
        const maxW = 400;
        const scale = Math.min(1, maxW/img.width);
        canvas.width = img.width*scale;
        canvas.height = img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        resumeData.portfolio[i].src = canvas.toDataURL('image/jpeg',0.8);
        resumeData.portfolio[i].type = 'image';
        if(!resumeData.portfolio[i].name) resumeData.portfolio[i].name = file.name.replace(/\.[^.]+$/, '');
        saveData();
        buildPortfolioForm();
      };
      img.src = ev.target.result;
    }
  };
  reader.readAsDataURL(file);
}


function buildEducationForm(){
  const e = resumeData.education;
  const container = document.getElementById('formEducation');
  container.innerHTML = `
    <div class="form-row">
      <input placeholder="学校" value="${escAttr(e.school||'')}" oninput="updateEducation('school',this.value)">
      <input placeholder="专业" value="${escAttr(e.major||'')}" oninput="updateEducation('major',this.value)">
    </div>
    <div class="form-row">
      <input placeholder="学历" value="${escAttr(e.degree||'')}" oninput="updateEducation('degree',this.value)">
      <input placeholder="时间段" value="${escAttr(e.period||'')}" oninput="updateEducation('period',this.value)">
    </div>
  `;
}

function updateEducation(field,value){
  resumeData.education[field] = value;
  debouncePreview();
}

function buildSkillsForm(){
  const container = document.getElementById('formSkills');
  let html = '<div class="dynamic-list">';
  (resumeData.skills||[]).forEach((s,i)=>{
    html += `<div class="dynamic-item">
      <button class="remove-btn" onclick="removeSkill(${i})">✕</button>
      <div class="form-row">
        <input placeholder="图标" value="${escAttr(s.icon||'')}" style="width:60px;flex:none" oninput="updateSkill(${i},'icon',this.value)">
        <input placeholder="分类名" value="${escAttr(s.category||'')}" oninput="updateSkill(${i},'category',this.value)">
      </div>
      <input placeholder="技能标签（逗号分隔）" value="${escAttr((s.items||[]).join(','))}" style="width:100%;margin-top:4px" oninput="updateSkill(${i},'items',this.value)">
    </div>`;
  });
  html += '</div><button class="add-btn" onclick="addSkill()">+ 添加技能分类</button>';
  container.innerHTML = html;
}

function addSkill(){
  if(!resumeData.skills) resumeData.skills = [];
  resumeData.skills.push({icon:'📌',category:'',items:[]});
  saveData();
  buildSkillsForm();
}
function removeSkill(i){
  resumeData.skills.splice(i,1);
  saveData();
  buildSkillsForm();
}
function updateSkill(i,field,value){
  if(field==='items') resumeData.skills[i].items = value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
  else resumeData.skills[i][field] = value;
  debouncePreview();
}

/* ================================================================
   TEMPLATE TABS
   ================================================================ */
function updateTemplateTabs(){
  const container = document.getElementById('templateTabs');
  container.innerHTML = TEMPLATES.map(t=>`
    <button class="template-btn${t.id===resumeData.templateId?' active':''}" onclick="selectTemplate('${t.id}')">${t.icon} ${t.name}</button>
  `).join('');
}

function selectTemplate(id){
  resumeData.templateId = id;
  saveData();
  updateTemplateTabs();
  renderPreview();
}

   ACCORDION
   ================================================================ */
function toggleAccordion(id){
  document.getElementById(id).classList.toggle('open');
}

/* ================================================================
   FILE NAME
   ================================================================ */
function onFileNameChange(){
  resumeData.fileName = document.getElementById('fileNameInput').value.trim() || '我的简历';
  saveData();
}

/* ================================================================
   EXPORT: HTML
   ================================================================ */
function exportHTML(){
  const tpl = getCurrentTemplate();
  const html = tpl.render(resumeData);
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (resumeData.fileName||'我的简历') + '.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('✅ HTML简历已导出！');
}

/* ================================================================
   EXPORT: PDF (via print)
   ================================================================ */
function exportPDF(){
  const iframe = document.getElementById('previewFrame');
  const win = window.open('', '_blank', 'width=900,height=700');
  win.document.write(iframe.srcdoc);
  win.document.close();
  win.focus();
  setTimeout(()=>{
    win.print();
    toast('💡 在打印对话框中选择"另存为PDF"即可');
  }, 500);
}

/* ================================================================
   CLEAR ALL
   ================================================================ */
function clearAll(){
  if(!confirm('确定清空所有内容吗？此操作不可恢复。')) return;
  resumeData = JSON.parse(JSON.stringify(EMPTY_DATA));
  saveData();
  buildAllForms();
  renderPreview();
  toast('🗑️ 已清空');
}

/* ================================================================
   UTILITY
   ================================================================ */
function esc(s){
  if(!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function escAttr(s){
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ================================================================
   KEYBOARD SHORTCUTS
   ================================================================ */
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey) && e.key==='s'){
    e.preventDefault();
    saveData();
    toast('💾 已自动保存');
  }
});

/* ================================================================
   INIT
   ================================================================ */
buildAllForms();
renderPreview();
updateTemplateTabs();

// Auto-rebuild iframe on window resize
let resizeTimeout;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(renderPreview, 200);
});
</script>
